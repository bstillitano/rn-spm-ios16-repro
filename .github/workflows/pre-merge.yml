name: Pre Merge Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  # Expected to fail: this job shows the bug. React Native's SPM autolinker
  # declares iOS 15 on the Autolinked package, and SwiftPM refuses to let it
  # depend on ios16-library, whose Package.swift requires iOS 16.
  test-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Yarn Install
        run: yarn install --frozen-lockfile
        working-directory: ReproducerApp

      - name: Update Swift packages
        run: npx react-native spm update
        working-directory: ReproducerApp

      - name: Build iOS
        run: >
          xcodebuild build
          -project ReproducerApp.xcodeproj
          -scheme ReproducerApp
          -configuration Debug
          -sdk iphonesimulator
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
        working-directory: ReproducerApp/ios
